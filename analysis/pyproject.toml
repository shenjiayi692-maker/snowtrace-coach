[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowtrace-analysis"
version = "0.1.0"
description = "Confidence-first video intelligence for the Snowtrace vertical slice"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mediapipe==0.10.35",
  "numpy==2.5.2",
  "opencv-contrib-python==5.0.0.93",
  "uvicorn[standard]==0.52.3",
]

[project.scripts]
snowtrace-analyze = "snowtrace_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowtrace_analysis"]
