[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowtrace-analysis"
version = "0.1.0"
description = "Confidence-first video intelligence for the Snowtrace vertical slice"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mediapipe>=0.10.30,<0.11",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
snowtrace-analyze = "snowtrace_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowtrace_analysis"]
